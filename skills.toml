[targets.claude.bundle]
name = 'vd'
version = "0.37.0"
description = "A daily-driver collection of skills for agentic coding. Build pipeline: scout → debug → brainstorm → plan → cook → ship. Plus code-review (PR review with inline gh-api comments + a consistent review voice), research (deep tech research), webdesign (modern web UI design/build/review/test), excalidraw (diagrams), markdown-render (book-like viewer), open-design (HTML design artifacts from nexu-io/open-design catalog), qmd (local Markdown search), computer-clean (macOS disk cleanup), omnimedia (multimodal AI: Gemini analysis + Codex/Gemini/OpenRouter/MiniMax image gen), auto-loop (autonomous goal-pursuit with two-vote completion gate), optimize-loop (metric-optimization loop — drive a measurable metric with auto keep/discard), scenario (edge-case generation across 12 dimensions + saturation loop), security (STRIDE+OWASP threat-modeled audit with optional fix loop), browser + browser-profile (CDP automation with named persistent Chrome profiles), and gws (Google Workspace via the official CLI). Scout and debug span software, data engineering, devops, and analytics surfaces."
plugin_description = "A daily-driver collection of skills for agentic coding, namespaced under `vd:` to avoid conflicts with other plugins."
source = './'
category = 'utilities'
homepage = 'https://github.com/vanducng/skills'
license = 'MIT'
version_strategy = 'manual'

