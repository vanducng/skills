<rect class="process" x="1520" y="100" width="180" height="80" rx="8" data-name="codex_user_dry_run"/>
<rect class="process" x="1520" y="220" width="180" height="80" rx="8" data-name="codex_user_install"/>
<rect class="process" x="1880" y="100" width="180" height="80" rx="8" data-name="codex_repo_dry_run"/>
