<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2520 500" width="100%" height="auto">
<style><![CDATA[
:root {
  --bg: #ffffff;
  --primary: #0a0a0a;
  --accent: #0a0a0a;
  --success: #0a0a0a;
  --error: #0a0a0a;
  --muted: #737373;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0a0a;
    --primary: #fafafa;
    --accent: #fafafa;
    --success: #fafafa;
    --error: #fafafa;
    --muted: #a3a3a3;
  }
}
.canvas { fill: var(--bg); }
.boundary { fill: none; stroke: var(--muted); stroke-width: 1; }
.service { fill: var(--bg); stroke: var(--primary); stroke-width: 2; }
.process { fill: var(--bg); stroke: var(--primary); stroke-width: 2; }
.state { fill: var(--bg); stroke: var(--primary); stroke-width: 2; }
.accent-stroke { stroke: var(--primary); stroke-width: 3.5; }
.connection-sync { stroke: var(--primary); stroke-width: 2; fill: none; }
.connection-async { stroke: var(--primary); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
.connection-error { stroke: var(--primary); stroke-width: 2; fill: none; stroke-dasharray: 2 2; }
text { font-family: "Inter", ui-sans-serif, system-ui, sans-serif; fill: var(--primary); font-size: 14px; }
text.muted { fill: var(--muted); font-style: italic; font-size: 12px; }
text.code { font-family: "JetBrains Mono", "Geist Mono", ui-monospace, monospace; font-size: 11px; }
text.label-tag { font-family: "JetBrains Mono", "Geist Mono", ui-monospace, monospace; font-size: 10px; fill: var(--muted); }
]]></style>
<defs>
<marker id="arrow-filled" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" class="arrow-fill"/>
</marker>
<marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10" fill="none" stroke-width="1.5" class="arrow-stroke"/>
</marker>
</defs>
<style><![CDATA[
.arrow-fill { fill: var(--primary); }
.arrow-stroke { stroke: var(--primary); }
]]></style>
<rect class="canvas" width="100%" height="100%"/>
<g class="layer-boundaries">
<rect class="boundary" x="60" y="60" width="260" height="280" rx="8" data-name="user"/>
<rect class="boundary" x="420" y="60" width="260" height="160" rx="8" data-name="cli"/>
<rect class="boundary" x="780" y="60" width="260" height="380" rx="8" data-name="plugin"/>
<rect class="boundary" x="1120" y="60" width="260" height="280" rx="8" data-name="dev"/>
