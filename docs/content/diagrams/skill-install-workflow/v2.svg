<path class="connection-async" d="M 910 300 L 910 320" marker-end="url(#arrow-open)"/>
<path class="connection-sync" d="M 1000 360 L 1620 360 L 1620 140 L 2240 140" marker-end="url(#arrow-filled)"/>
<path class="connection-sync" d="M 1250 180 L 1250 220" marker-end="url(#arrow-filled)"/>
<path class="connection-sync" d="M 1340 260 L 1790 260 L 1790 140 L 2240 140" marker-end="url(#arrow-filled)"/>
<path class="connection-sync" d="M 1610 180 L 1610 220" marker-end="url(#arrow-filled)"/>
<path class="connection-sync" d="M 1700 260 L 1970 260 L 1970 140 L 2240 140" marker-end="url(#arrow-filled)"/>
<path class="connection-sync" d="M 1970 180 L 1970 220" marker-end="url(#arrow-filled)"/>
<path class="connection-sync" d="M 2060 260 L 2150 260 L 2150 140 L 2240 140" marker-end="url(#arrow-filled)"/>
<path class="connection-sync" d="M 2330 180 L 2330 220" marker-end="url(#arrow-filled)"/>
<path class="connection-sync" d="M 2330 300 L 2330 320" marker-end="url(#arrow-filled)"/>
</g>
