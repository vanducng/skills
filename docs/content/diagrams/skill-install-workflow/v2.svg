<rect class="boundary" x="1840" y="60" width="260" height="280" rx="8" data-name="codex_repo"/>
<rect class="boundary" x="2200" y="60" width="260" height="380" rx="8" data-name="verify"/>
</g>
<g class="layer-labels">
<text class="muted" x="80" y="88">User</text>
<text class="muted" x="440" y="88">CLI</text>
