<path class="connection-sync" d="M 280 260 L 370 260 L 370 140 L 460 140" marker-end="url(#arrow-filled)"/>
<path class="connection-sync" d="M 640 140 L 730 140 L 730 140 L 820 140" marker-end="url(#arrow-filled)"/>
<path class="connection-sync" d="M 640 140 L 900 140 L 900 140 L 1160 140" marker-end="url(#arrow-filled)"/>
<path class="connection-sync" d="M 640 140 L 1080 140 L 1080 140 L 1520 140" marker-end="url(#arrow-filled)"/>
<path class="connection-sync" d="M 640 140 L 1260 140 L 1260 140 L 1880 140" marker-end="url(#arrow-filled)"/>
