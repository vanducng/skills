<tspan x="1610" dy="1.4em" text-anchor="middle">install</tspan>
<text x="1970" y="140" text-anchor="middle" dominant-baseline="middle">Codex repo</text>
<tspan x="1970" dy="1.4em" text-anchor="middle">dry-run</tspan>
<text x="1970" y="260" text-anchor="middle" dominant-baseline="middle">Codex repo</text>
<tspan x="1970" dy="1.4em" text-anchor="middle">install</tspan>
<text x="2330" y="140" text-anchor="middle" dominant-baseline="middle">Verify</text>
<tspan x="2330" dy="1.4em" text-anchor="middle">install</tspan>
<text x="2330" y="260" text-anchor="middle" dominant-baseline="middle">Validate</text>
<tspan x="2330" dy="1.4em" text-anchor="middle">scripts</tspan>
<text x="2330" y="360" text-anchor="middle" dominant-baseline="middle">Ready to</text>
<tspan x="2330" dy="1.4em" text-anchor="middle">invoke</tspan>
<g class="arrow-label">
<rect x="340" y="248" width="84" height="18" style="fill: var(--bg)"/>
<text x="382" y="262" text-anchor="middle" class="code">CLI-managed</text>
</g>
<g class="arrow-label">
<rect x="650" y="128" width="70" height="18" style="fill: var(--bg)"/>
