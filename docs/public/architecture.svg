<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="title">vd skills repository architecture</title>
  <desc id="desc">Skill sources and Markdown docs flow through validation and build into Claude Code, Codex, and an Astro Starlight site on GitHub Pages.</desc>

  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="16" y="16" width="1148" height="528" rx="20" fill="url(#page)" stroke="#cbe7e3" stroke-width="1.5"/>

  <!-- column headers -->
  <g fill="#0f766e" font-size="14" font-weight="800" letter-spacing="0.12em">
    <text x="96" y="74">SOURCES</text>
    <text x="452" y="74">BUILD</text>
    <text x="846" y="74">OUTPUTS</text>
  </g>

  <!-- connectors -->
  <g fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M328 158 H432"/>
    <path d="M328 270 H432"/>
    <path d="M328 382 H432"/>
    <path d="M768 158 H838"/>
    <path d="M768 270 H838"/>
    <path d="M768 382 H838"/>
  </g>

  <!-- cards -->
  <g filter="url(#card)">
    <rect x="96" y="112" width="232" height="92" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="96" y="224" width="232" height="92" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="96" y="336" width="232" height="92" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="432" y="104" width="336" height="332" rx="15" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="838" y="112" width="246" height="92" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="838" y="224" width="246" height="92" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="838" y="336" width="246" height="92" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
  </g>

  <!-- left accent bars -->
  <g>
    <rect x="96" y="112" width="5" height="92" rx="2.5" fill="#14b8a6"/>
    <rect x="96" y="224" width="5" height="92" rx="2.5" fill="#14b8a6"/>
    <rect x="96" y="336" width="5" height="92" rx="2.5" fill="#14b8a6"/>
    <rect x="432" y="104" width="5" height="332" rx="2.5" fill="#0d9488"/>
    <rect x="838" y="112" width="5" height="92" rx="2.5" fill="#06b6d4"/>
    <rect x="838" y="224" width="5" height="92" rx="2.5" fill="#06b6d4"/>
    <rect x="838" y="336" width="5" height="92" rx="2.5" fill="#06b6d4"/>
  </g>

  <!-- titles -->
  <g fill="#0f172a" font-weight="800" font-size="21">
    <text x="120" y="150">skills/</text>
    <text x="120" y="262">skills.toml</text>
    <text x="120" y="374">website/</text>
    <text x="462" y="146">Validate &amp; build</text>
    <text x="864" y="150">Claude Code</text>
    <text x="864" y="262">Codex</text>
    <text x="864" y="374">GitHub Pages</text>
  </g>

  <!-- body text -->
  <g fill="#475569" font-size="15">
    <text x="120" y="176">SKILL.md packages</text>
    <text x="120" y="195" fill="#94a3b8" font-size="13">scripts, references, assets</text>

    <text x="120" y="288">tracked upstreams</text>
    <text x="120" y="307" fill="#94a3b8" font-size="13">target configuration</text>

    <text x="120" y="400">Astro Starlight docs</text>
    <text x="120" y="419" fill="#94a3b8" font-size="13">Markdown in website/docs/</text>

    <text x="864" y="176">plugin + marketplace</text>
    <text x="864" y="195" fill="#94a3b8" font-size="13">vd@vd-skills</text>

    <text x="864" y="288">.agents/skills links</text>
    <text x="864" y="307" fill="#94a3b8" font-size="13">user or repo scope</text>

    <text x="864" y="400">skills.vanducng.dev</text>
    <text x="864" y="419" fill="#94a3b8" font-size="13">Astro static site</text>
  </g>

  <!-- control-plane steps -->
  <g>
    <g fill="#14b8a6"><circle cx="468" cy="183" r="3.5"/><circle cx="468" cy="217" r="3.5"/><circle cx="468" cy="251" r="3.5"/><circle cx="468" cy="285" r="3.5"/><circle cx="468" cy="319" r="3.5"/></g>
    <g fill="#334155" font-size="16">
      <text x="484" y="188">validate skills</text>
      <text x="484" y="222">check versions</text>
      <text x="484" y="256">doctor drift</text>
      <text x="484" y="290">vd build — agent targets</text>
      <text x="484" y="324">astro build — docs site</text>
    </g>
    <line x1="462" y1="352" x2="738" y2="352" stroke="#e2e8f0" stroke-width="1.4"/>
    <text x="462" y="384" fill="#94a3b8" font-size="14">Reproducible outputs from source files.</text>
  </g>
</svg>
