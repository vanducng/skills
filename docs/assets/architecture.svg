    <text x="95" y="190" font-size="13" fill="#64748b">scripts, references, assets</text>
    <text x="95" y="245" font-size="22" font-weight="700">skills.toml</text>
    <text x="95" y="274" font-size="15" fill="#475569">tracked upstreams</text>
    <text x="95" y="300" font-size="13" fill="#64748b">target configuration</text>
    <text x="95" y="355" font-size="22" font-weight="700">docs/</text>
