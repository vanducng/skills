    <path d="M415 260l-11-6v12z"/>
    <path d="M415 370l-11-6v12z"/>
    <path d="M790 260l-11-6v12z"/>
    <path d="M515 235l-6-11h12z"/>
    <path d="M515 330l-6-11h12z"/>
    <path d="M890 150l-6 11h12z"/>
    <path d="M890 370l-6-11h12z"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="95" width="200" height="110" rx="10" fill="#ffffff" stroke="#99f6e4"/>
    <rect x="70" y="205" width="200" height="110" rx="10" fill="#ffffff" stroke="#bae6fd"/>
    <rect x="70" y="315" width="200" height="110" rx="10" fill="#ffffff" stroke="#fed7aa"/>
    <rect x="415" y="110" width="220" height="300" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="790" y="95" width="230" height="110" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
