name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run frontmatter validator
        run: bash scripts/validate.sh
      - name: Run hook test suites
        run: |
          python3 hooks/lib/test_paths.py
          python3 hooks/test_hooks.py
          python3 hooks/test_agent_notify.py
          python3 skills/workbench/scripts/test_workbench.py
          python3 skills/resume-screen/scripts/test_write_scorecard.py
          python3 skills/resume-screen/scripts/test_example_screen.py
      - name: Check release version consistency
        run: bash scripts/check-release-versions.sh
      - name: Check docs site contract
        run: bash scripts/check-docs-site.sh --check
