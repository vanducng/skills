name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # MiuMun app token (not GITHUB_TOKEN) so a later merge of the release PR re-triggers this workflow and cuts the tag.
      - name: Generate MiuMun app token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID || secrets.GH_APP_CLIENT_ID || secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_MUNMIU_PRIVATE_KEY }}

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app_token.outputs.token }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # Do not auto-merge. An old bootstrap-sha plus auto-merge published
      # colliding versions (1.5.0-1.7.0, then 0.43.0) over the catalog.
      # Review the proposed version against existing tags before merging.
