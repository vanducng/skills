name: vd Release Please

# Opens a release PR when conventional commits with scope "vd" land on main.
# Merging the PR bumps CHANGELOG.md and the manifest, but does NOT create
# the GitHub Release or the tag — that's done manually by the maintainer:
#
#   git pull && git tag vX.Y.Z && git push origin vX.Y.Z
#
# The tag push then triggers vd-release.yml -> GoReleaser -> binaries +
# Homebrew formula publish.
#
# Why skip-github-release: release-please-action v5 hits a 403 "Resource
# not accessible by integration" on createRelease even with contents:write.
# Skipping that step bypasses the bug; GoReleaser creates the release.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
