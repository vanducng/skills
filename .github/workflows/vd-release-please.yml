name: vd Release Please

# Opens a release PR when conventional commits with scope "vd" land on main.
# Merging the PR bumps CHANGELOG.md and creates a vd/v* tag,
# which then triggers vd-release.yml.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
