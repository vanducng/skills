name: Code Review

# `synchronize` is what makes a push re-review. Without it the reviewer only
# ever sees the first commit, so later commits merge unreviewed and an already
# fixed finding keeps displaying as open (PR #381).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: code-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Explicit secrets (not `inherit`): the reusable workflow is in a different
    # account (dataplanelabs), and `secrets: inherit` does not cross owners.
    # Pinned to a SHA, not @main: this job runs on pull_request_target, so it has
    # write permissions and the review secrets. A mutable ref would let a force
    # push in that repo run arbitrary code here.
    uses: dataplanelabs/workflows/.github/workflows/code-review.yml@3f0b08bfbb333ad2b190decb8abe76afe8f2e429 # main @ 2026-06-20
    secrets:
      OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
      OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
      OCR_LLM_MODEL: ${{ secrets.OCR_LLM_MODEL }}
      OCR_LLM_USE_ANTHROPIC: ${{ secrets.OCR_LLM_USE_ANTHROPIC }}
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_MUNMIU_PRIVATE_KEY: ${{ secrets.GH_APP_MUNMIU_PRIVATE_KEY }}
