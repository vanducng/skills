# Machine-readable shadow of action-vocab.md.
# Must stay in sync; scripts/lint-vocab-sync.sh enforces.
# Schema: { actions: { <name>: { dispatch, args, verifier, parallel_with, gate_default, delegated_to } } }

version: 1

actions:
  scout:
    dispatch: "skill:vd:scout"
    args: ""
    verifier: null
    parallel_with: [research]
    gate_default: []
    delegated_to: null

  research:
    dispatch: "skill:vd:research"
    args: ""
    verifier: null
    parallel_with: [scout]
    gate_default: []
    delegated_to: null

  brainstorm:
    dispatch: "skill:vd:brainstorm"
    args: "--deep"
    verifier: null
    parallel_with: []
    gate_default: [semi, manual]
    delegated_to: null

  plan:
    dispatch: "skill:vd:plan"
    args: "--deep"
    verifier:
      type: cmd_exits_zero
      args:
        cmd: "test -d {plan_dir}"
    parallel_with: []
    gate_default: [semi, manual]
    delegated_to: null

  plan_audit:
    dispatch: "skill:vd:plan-audit"
    args: "{plan_dir}"
    verifier: null
    parallel_with: []
    gate_default: ["when:risk_tier=high"]
    delegated_to: null

  cook:
    dispatch: "skill:vd:cook"
    args: "--auto {plan_dir}"
    verifier:
      type: test_suite_passes
      args:
        target: "{profile.test_cmd}"
    parallel_with: []
    gate_default: []
    delegated_to: vd:auto-loop

  code_review:
    dispatch: "agent:code-reviewer"
    args: ""
    verifier: null
    parallel_with: [test]
    gate_default: []
    delegated_to: null

  test:
    dispatch: "agent:tester"
    args: ""
    verifier:
      type: test_suite_passes
      args:
        target: "{profile.test_cmd}"
    parallel_with: [code_review]
    gate_default: []
    delegated_to: vd:auto-loop

  ship:
    dispatch: "skill:vd:ship"
    args: "{ship_mode}"
    verifier:
      type: ci_green
      args:
        pr_number: "{pr_number}"
    parallel_with: []
    gate_default: [semi, manual]
    delegated_to: null

  wait_ci:
    dispatch: "monitor:gh pr checks {pr_number} --repo {repo} --json name,bucket"
    args: ""
    verifier: null
    parallel_with: []
    gate_default: []
    delegated_to: null

  image_build_wait:
    dispatch: "monitor:gh run view {run_id} --repo {repo} --json status,conclusion,jobs"
    args: ""
    verifier: null
    parallel_with: []
    gate_default: []
    delegated_to: null

  reconcile:
    dispatch: "shell:{profile.deploy.reconcile_cmd}"
    args: ""
    verifier: null
    parallel_with: []
    gate_default: []
    delegated_to: null

  rollout_check:
    dispatch: "shell:{profile.deploy.rollout_cmd}"
    args: ""
    verifier:
      type: cmd_exits_zero
      args:
        cmd: "{profile.deploy.rollout_cmd}"
    parallel_with: []
    gate_default: []
    delegated_to: null

  verify_pod_image:
    dispatch: "shell:kubectl --context {profile.kube_context} get deployment {profile.verify.deployment} -n {profile.verify.namespace} -o jsonpath='{.spec.template.spec.containers[0].image}'"
    args: ""
    verifier:
      from_target_verifiers: pod_image_matches
    parallel_with: []
    gate_default: []
    delegated_to: null

  verify_smoke:
    dispatch: "shell:{profile.verify.smoke_cmd}"
    args: ""
    verifier:
      from_target_verifiers: all
    parallel_with: []
    gate_default: [semi, manual]
    delegated_to: null

  debug:
    dispatch: "skill:vd:debug"
    args: ""
    verifier: null
    parallel_with: []
    gate_default: []
    delegated_to: null

  fix:
    dispatch: "skill:vd:fix"
    args: ""
    verifier: null
    parallel_with: []
    gate_default: []
    delegated_to: null

  docs:
    dispatch: "skill:vd:docs"
    args: ""
    verifier: null
    parallel_with: []
    gate_default: []
    delegated_to: null

  journal:
    dispatch: "skill:vd:journal"
    args: ""
    verifier: null
    parallel_with: []
    gate_default: []
    delegated_to: null

  done:
    dispatch: "terminal"
    args: ""
    verifier: null
    parallel_with: []
    gate_default: []
    delegated_to: null

  block:
    dispatch: "terminal"
    args: ""
    verifier: null
    parallel_with: []
    gate_default: []
    delegated_to: null
