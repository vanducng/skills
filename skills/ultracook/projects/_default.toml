# _default.toml — fallback profile for any repo whose remote_url doesn't match
# a more-specific profile in this directory. Conservative: no auto-merge, no
# deploy step, ship-target stops at PR.
#
# Env-var indirection: profile shell commands MAY reference ${VAR:-default} to
# stay portable across machines. Avoid hardcoded absolute paths.
#
# NEVER set ship_mode to include "--auto" here — per [[feedback-no-auto-merge-skills-repo]]
# unknown repos default to manual merge.

[project]
name = "default"
remote_matches = []   # _default.toml is the fallback, no matching needed
default_branch_prefix = "feat/"
ship_mode = "official"   # no --auto

[actions]
# Local-target sequence (target.kind=local): plan → cook → done.
# PR-target sequence (target.kind=pr-only): + ship → wait_ci → done.
# Cluster-target sequence (target.kind=cluster): would normally + image_build_wait
# → reconcile → rollout_check → verify_smoke → done, but _default has no deploy
# config, so cluster-target on an unknown repo falls back to pr-only sequence
# and warns.
default_sequence_local    = ["plan", "cook", "code_review", "test", "done"]
default_sequence_pr_only  = ["plan", "cook", "code_review", "test", "ship", "wait_ci", "done"]
default_sequence_cluster  = ["plan", "cook", "code_review", "test", "ship", "wait_ci", "done"]   # falls back to pr-only

[deploy]
# Intentionally empty. _default doesn't know how to deploy.

[verify]
# Intentionally empty.
test_cmd = ""   # consumer should error if test action runs without override
smoke_cmd = ""

[budgets]
max_iterations = 30
max_rebases = 3
max_ci_reruns = 2
token_pct_cap = 80
