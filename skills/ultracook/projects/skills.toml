# skills.toml - profile for THIS skills repo (vanducng/skills).
#
# IMPORTANT: ship_mode MUST NOT include --auto. Per [[feedback-no-auto-merge-skills-repo]]
# every PR to the skills repo is reviewed and merged manually by the user.
# This is a hard rule - do not relax it.

[project]
name = "skills"
remote_matches = [
  "vanducng/skills",
  "dataplanelabs/skills",   # in case the repo is ever forked
]
default_branch_prefix = "feat/"
ship_mode = "official"   # NO --auto. User merges manually.

[actions]
# Skills repo is a docs+bash skill catalogue, no service to deploy.
# All targets ship at most a PR.
default_sequence_local    = ["plan", "cook", "code_review", "test", "done"]
default_sequence_pr_only  = ["plan", "cook", "code_review", "test", "ship", "wait_ci", "done"]
default_sequence_cluster  = ["plan", "cook", "code_review", "test", "ship", "wait_ci", "done"]   # cluster=N/A; falls back to pr-only

[deploy]
# No deploy step on the skills repo.

[verify]
test_cmd = "bash -n skills/*/scripts/*.sh 2>&1 | grep -v '^$' || true"
# smoke_cmd intentionally empty - manual smoke of a slash command is the only
# meaningful test until skill-level test infra exists.
smoke_cmd = ""

[budgets]
max_iterations = 20      # tighter for the skills repo; PRs here should be small
max_rebases = 2
max_ci_reruns = 1
token_pct_cap = 80
