# goclaw.toml — profile for the goclaw fork (dataplanelabs/goclaw).
#
# Goclaw is the user's primary fork. Auto-merge is acceptable here (different
# from the skills repo) because the user explicitly opt-in to fast iteration
# on goclaw PRs.

[project]
name = "goclaw"
remote_matches = [
  "dataplanelabs/goclaw",
  "nextlevelbuilder/goclaw",   # upstream — ultracook runs are unlikely here but match anyway
]
default_branch_prefix = "fix/"
ship_mode = "official --auto"   # OK on goclaw; NOT ok on skills repo

[actions]
default_sequence_local    = ["plan", "cook", "code_review", "test", "done"]
default_sequence_pr_only  = ["plan", "cook", "code_review", "test", "ship", "wait_ci", "done"]
default_sequence_cluster  = [
  "plan", "cook", "code_review", "test",
  "ship", "wait_ci",
  "image_build_wait",
  "reconcile", "rollout_check",
  "verify_pod_image", "verify_smoke",
  "done"
]

[deploy]
# Env-var indirection so the profile is portable. INFRA_REPO defaults to the
# user's standard checkout path; KUBE_CONTEXT defaults to everest.
reconcile_cmd = "cd ${INFRA_REPO:-$HOME/git/personal/dataplanelabs/infra} && flux --context ${KUBE_CONTEXT:-everest} reconcile image repository goclaw -n flux-system && flux --context ${KUBE_CONTEXT:-everest} reconcile image update goclaw -n flux-system && flux --context ${KUBE_CONTEXT:-everest} reconcile kustomization apps-goclaw -n flux-system"
rollout_cmd = "kubectl --context ${KUBE_CONTEXT:-everest} rollout status deployment/goclaw -n goclaw --timeout=180s"

[verify]
deployment = "goclaw"
namespace = "goclaw"
kube_context = "${KUBE_CONTEXT:-everest}"
# pod_image_template uses {tag} placeholder, resolved at verify time from
# state.last_action_result.evidence (the tag pushed by the ship action).
pod_image_template = "ghcr.io/dataplanelabs/goclaw:{tag}-full"
test_cmd = "go build ./... && go test ./... -short"
# smoke_cmd reserved for a goclaw-specific health probe; populate when a
# stable smoke URL is in place.
smoke_cmd = ""

[budgets]
max_iterations = 30
max_rebases = 3
max_ci_reruns = 2
token_pct_cap = 80
