<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Tracking board</title>
<script>
// Theme before first paint: ?theme=light|dark forces it for this load; otherwise the saved choice; otherwise the system setting.
(function () {
  var t = new URLSearchParams(location.search).get("theme"), saved = null;
  try { saved = localStorage.getItem("tb-theme"); } catch (e) { /* private mode */ }
  t = t || saved;
  if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
})();
</script>
<style>
  /* ===== Design tokens (shared with the board index page: keep the names) ===== */
  :root {
    color-scheme: light dark;
    --tb-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --tb-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --tb-fs-xs: 12px; --tb-fs-sm: 13px; --tb-fs-md: 15px; --tb-fs-lg: 17px; --tb-fs-xl: 21px; --tb-fs-2xl: 26px; --tb-fs-3xl: 34px;
    --tb-lh-tight: 1.2; --tb-lh-body: 1.5;
    --tb-fs-meta: 14px;
    --tb-sp-1: 4px; --tb-sp-2: 8px; --tb-sp-3: 12px; --tb-sp-4: 16px; --tb-sp-5: 24px; --tb-sp-6: 32px; --tb-sp-7: 48px;
    --tb-r-sm: 8px; --tb-r-md: 12px; --tb-r-lg: 16px; --tb-r-pill: 999px;
    --tb-tap: 44px; --tb-bar-h: 56px; --tb-rail-w: 232px; --tb-sheet-w: 340px;
    --tb-bg: #f4f6f9; --tb-surface: #ffffff; --tb-surface-2: #eef1f5; --tb-line: #d3d9e1; --tb-line-strong: #7a8496;
    --tb-text: #131820; --tb-muted: #465163; --tb-accent: #0b5cc7; --tb-accent-ink: #ffffff; --tb-accent-soft: #e2eeff;
    --tb-focus: #0b5cc7; --tb-scrim: rgba(12, 16, 22, .48);
    --tb-shadow: 0 1px 2px rgba(19, 24, 32, .06), 0 4px 14px rgba(19, 24, 32, .06);
    --tb-shadow-up: 0 -6px 30px rgba(19, 24, 32, .22);
    --tb-ok: #11632b; --tb-ok-soft: #d9f3e0; --tb-ok-bar: #1f8a43;
    --tb-doing: #0b5cc7; --tb-doing-soft: #e2eeff;
    --tb-blocked: #a8121c; --tb-blocked-soft: #ffe3e1;
    --tb-decide: #704400; --tb-decide-soft: #ffefbf;
    --tb-planned: #465163; --tb-planned-soft: #e6eaf0;
    --tb-new: #b4410f;
    --role-ours-fill: #e2eeff; --role-ours-line: #0b5cc7;
    --role-provider-fill: #f4e9ff; --role-provider-line: #7640c9;
    --role-person-fill: #ffefbf; --role-person-line: #8a5300;
    --role-store-fill: #eef1f5; --role-store-line: #4d586a;
    --role-legacy-fill: #ffffff; --role-legacy-line: #6b7686;
    --role-risk-fill: #ffe3e1; --role-risk-line: #b3141f;
    --role-done-fill: #d9f3e0; --role-done-line: #11632b;
  }
  :root[data-theme="dark"] {
    --tb-bg: #0d1117; --tb-surface: #161b23; --tb-surface-2: #1e2530; --tb-line: #2c3542; --tb-line-strong: #6c7a8c;
    --tb-text: #e9edf3; --tb-muted: #a6b1c0; --tb-accent: #6fb2ff; --tb-accent-ink: #04121f; --tb-accent-soft: #14304f;
    --tb-focus: #8cc4ff; --tb-scrim: rgba(0, 0, 0, .62);
    --tb-shadow: 0 1px 2px rgba(0, 0, 0, .4); --tb-shadow-up: 0 -6px 30px rgba(0, 0, 0, .6);
    --tb-ok: #62d68b; --tb-ok-soft: #12321f; --tb-ok-bar: #3fb868;
    --tb-doing: #7dbaff; --tb-doing-soft: #14304f;
    --tb-blocked: #ff9690; --tb-blocked-soft: #4a1c1d;
    --tb-decide: #f5c764; --tb-decide-soft: #3a2d0b;
    --tb-planned: #aeb8c6; --tb-planned-soft: #262e3a;
    --tb-new: #ff9d6b;
    --role-ours-fill: #14304f; --role-ours-line: #6fb2ff;
    --role-provider-fill: #2b1d47; --role-provider-line: #b794f6;
    --role-person-fill: #3a2d0b; --role-person-line: #f5c764;
    --role-store-fill: #1e2530; --role-store-line: #9aa6b6;
    --role-legacy-fill: #161b23; --role-legacy-line: #8793a4;
    --role-risk-fill: #4a1c1d; --role-risk-line: #ff9690;
    --role-done-fill: #12321f; --role-done-line: #62d68b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --tb-bg: #0d1117; --tb-surface: #161b23; --tb-surface-2: #1e2530; --tb-line: #2c3542; --tb-line-strong: #6c7a8c;
      --tb-text: #e9edf3; --tb-muted: #a6b1c0; --tb-accent: #6fb2ff; --tb-accent-ink: #04121f; --tb-accent-soft: #14304f;
      --tb-focus: #8cc4ff; --tb-scrim: rgba(0, 0, 0, .62);
      --tb-shadow: 0 1px 2px rgba(0, 0, 0, .4); --tb-shadow-up: 0 -6px 30px rgba(0, 0, 0, .6);
      --tb-ok: #62d68b; --tb-ok-soft: #12321f; --tb-ok-bar: #3fb868;
      --tb-doing: #7dbaff; --tb-doing-soft: #14304f;
      --tb-blocked: #ff9690; --tb-blocked-soft: #4a1c1d;
      --tb-decide: #f5c764; --tb-decide-soft: #3a2d0b;
      --tb-planned: #aeb8c6; --tb-planned-soft: #262e3a;
      --tb-new: #ff9d6b;
      --role-ours-fill: #14304f; --role-ours-line: #6fb2ff;
      --role-provider-fill: #2b1d47; --role-provider-line: #b794f6;
      --role-person-fill: #3a2d0b; --role-person-line: #f5c764;
      --role-store-fill: #1e2530; --role-store-line: #9aa6b6;
      --role-legacy-fill: #161b23; --role-legacy-line: #8793a4;
      --role-risk-fill: #4a1c1d; --role-risk-line: #ff9690;
      --role-done-fill: #12321f; --role-done-line: #62d68b;
    }
  }

  /* ===== Shell: bar, rail, menu, cards, pills, chips ===== */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--tb-bar-h) + 12px); }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  body { margin: 0; background: var(--tb-bg); color: var(--tb-text); font: var(--tb-fs-md)/var(--tb-lh-body) var(--tb-font);
    padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); overflow-wrap: break-word; }
  h1, h2, h3, p, ul, ol, figure, blockquote { margin: 0; } ul, ol { padding: 0; list-style: none; }
  a { color: var(--tb-accent); text-underline-offset: 2px; }
  :focus-visible { outline: 3px solid var(--tb-focus); outline-offset: 2px; border-radius: 6px; }
  button, input, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip { position: absolute; left: 8px; top: -60px; background: var(--tb-accent); color: var(--tb-accent-ink); padding: 10px 14px; border-radius: 8px; z-index: 100; }
  .skip:focus { top: 8px; }

  .bar { position: sticky; top: 0; z-index: 40; height: calc(var(--tb-bar-h) + env(safe-area-inset-top)); padding: env(safe-area-inset-top) var(--tb-sp-3) 0;
    display: flex; align-items: center; gap: var(--tb-sp-2); background: color-mix(in srgb, var(--tb-surface) 92%, transparent);
    -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--tb-line); }
  .bar .title { flex: 1; min-width: 0; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ibtn { min-width: var(--tb-tap); height: var(--tb-tap); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 var(--tb-sp-3);
    border: 1px solid var(--tb-line-strong); background: var(--tb-surface); border-radius: var(--tb-r-md); cursor: pointer; font-weight: 600; font-size: var(--tb-fs-sm); }
  .ibtn[aria-pressed="true"], .ibtn[aria-expanded="true"] { background: var(--tb-accent-soft); border-color: var(--tb-accent); color: var(--tb-accent); }
  .ibtn svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--tb-accent); color: var(--tb-accent-ink); font-size: var(--tb-fs-xs); font-weight: 700; display: none; align-items: center; justify-content: center; }
  .badge.on { display: inline-flex; }
  .lbl { display: none; } @media (min-width: 560px) { .lbl { display: inline; } }

  .menu { position: fixed; left: 0; right: 0; top: calc(var(--tb-bar-h) + env(safe-area-inset-top)); z-index: 39; background: var(--tb-surface); border-bottom: 1px solid var(--tb-line);
    box-shadow: var(--tb-shadow); padding: var(--tb-sp-2) var(--tb-sp-3) var(--tb-sp-3); display: none; max-height: calc(100vh - var(--tb-bar-h) - env(safe-area-inset-top)); overflow: auto; overscroll-behavior: contain; }
  .menu.open { display: block; }
  .menu a, .rail a { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: var(--tb-tap); padding-top: 4px; padding-bottom: 4px; padding: 0 var(--tb-sp-3); border-radius: var(--tb-r-sm); color: var(--tb-text); text-decoration: none; }
  .menu a:active, .rail a:hover { background: var(--tb-surface-2); }
  .menu a .n, .rail a .n { color: var(--tb-muted); font-size: var(--tb-fs-sm); font-variant-numeric: tabular-nums; }
  .menu a.sub, .rail a.sub { padding-left: var(--tb-sp-6); color: var(--tb-muted); }
  .menu a > span:first-child, .rail a > span:first-child { min-width: 0; overflow-wrap: anywhere; line-height: 1.3; }
  .rail { display: none; }
  .menu .menuclose { width: 100%; justify-content: center; margin-bottom: var(--tb-sp-1); } .menu .menuclose:last-child { margin: var(--tb-sp-1) 0 0; }

  .page { padding: var(--tb-sp-4) var(--tb-sp-4) calc(var(--tb-sp-7) + env(safe-area-inset-bottom)); display: grid; gap: var(--tb-sp-4); align-content: start; min-width: 0; }
  @media (min-width: 700px) { .page { padding: var(--tb-sp-5) var(--tb-sp-5) calc(var(--tb-sp-7) + env(safe-area-inset-bottom)); gap: var(--tb-sp-5); } }
  @media (min-width: 1024px) {
    html { scroll-padding-top: calc(var(--tb-bar-h) + 80px); }
    body { display: grid; grid-template-columns: var(--tb-rail-w) minmax(0, 1fr); grid-template-rows: auto 1fr; }
    .bar { grid-column: 1 / -1; }
    .rail { display: block; position: sticky; top: var(--tb-bar-h); align-self: start; height: calc(100vh - var(--tb-bar-h)); overflow: auto; padding: var(--tb-sp-4) var(--tb-sp-3); border-right: 1px solid var(--tb-line); }
    .rail h2 { font-size: var(--tb-fs-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--tb-muted); padding: var(--tb-sp-2) var(--tb-sp-3); }
    .rail a[aria-current="true"] { background: var(--tb-accent-soft); color: var(--tb-accent); font-weight: 650; }
    .page { padding: var(--tb-sp-5) var(--tb-sp-6) var(--tb-sp-7); gap: var(--tb-sp-5); }
    .menubtn { display: none; }
  }
  @media (min-width: 1500px) { .page { max-width: 1320px; } }

  .card { background: var(--tb-surface); border: 1px solid var(--tb-line); border-radius: var(--tb-r-lg); box-shadow: var(--tb-shadow); min-width: 0; }
  .card > h2 { font-size: var(--tb-fs-lg); line-height: var(--tb-lh-tight); font-weight: 700; }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: var(--tb-r-pill); font-size: var(--tb-fs-xs); font-weight: 700; white-space: nowrap; background: var(--tb-planned-soft); color: var(--tb-planned); }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .pill.done, .pill.accepted, .pill.pass { background: var(--tb-ok-soft); color: var(--tb-ok); } .pill.doing { background: var(--tb-doing-soft); color: var(--tb-doing); }
  .pill.blocked, .pill.fail { background: var(--tb-blocked-soft); color: var(--tb-blocked); } .pill.decide { background: var(--tb-decide-soft); color: var(--tb-decide); }
  .pill.planned::before { background: transparent; border: 2px solid currentColor; } .pill.blocked::before, .pill.fail::before { border-radius: 2px; } .pill.decide::before { border-radius: 2px; transform: rotate(45deg); }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: var(--tb-tap); padding: 0 var(--tb-sp-3); border: 1px solid var(--tb-line-strong); border-radius: var(--tb-r-pill); background: var(--tb-surface); color: var(--tb-text); font-weight: 600; font-size: var(--tb-fs-sm); cursor: pointer; white-space: nowrap; text-decoration: none; }
  .chip .n { color: var(--tb-muted); font-variant-numeric: tabular-nums; font-weight: 600; }
  .chip[aria-pressed="true"] { background: var(--tb-text); border-color: var(--tb-text); color: var(--tb-bg); } .chip[aria-pressed="true"] .n { color: inherit; opacity: .85; }
  .chip svg { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .search { position: relative; } .search svg { position: absolute; left: 14px; top: 13px; width: 18px; height: 18px; fill: none; stroke: var(--tb-muted); stroke-width: 2; stroke-linecap: round; pointer-events: none; }
  .search input { width: 100%; height: var(--tb-tap); padding: 0 var(--tb-sp-4) 0 42px; border: 1px solid var(--tb-line-strong); border-radius: var(--tb-r-md); background: var(--tb-surface); color: var(--tb-text); font-size: 16px; }
  .search input::placeholder { color: var(--tb-muted); }
  .meta { color: var(--tb-muted); font-size: var(--tb-fs-meta); }
  .bartrack { height: 8px; border-radius: 4px; background: var(--tb-planned-soft); box-shadow: inset 0 0 0 1px var(--tb-line-strong); overflow: hidden; } .bartrack i { display: block; height: 100%; background: var(--tb-ok-bar); border-radius: 4px; }
  .newdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--tb-new); margin-right: 6px; vertical-align: 1px; flex: none; }
  .mono { font-family: var(--tb-mono); }
  .chv { display: inline-flex; color: var(--tb-muted); } .chv svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-reduced-motion: no-preference) { .sheet, .scrim, .chip, .ibtn, .chv svg { transition: transform .2s ease, opacity .2s ease, background-color .15s; } }

  /* ===== Board page ===== */
  .hero { display: grid; gap: var(--tb-sp-2); }
  .crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--tb-muted); font-size: var(--tb-fs-meta); }
  .hero h1 { font-size: var(--tb-fs-2xl); line-height: var(--tb-lh-tight); letter-spacing: -.01em; }
  .hero .headline { font-size: var(--tb-fs-md); max-width: 70ch; }
  .changed { display: inline-flex; align-items: center; min-height: var(--tb-tap); padding: 0 var(--tb-sp-3); border-radius: var(--tb-r-pill); border: 1px solid var(--tb-new); color: var(--tb-new); font-weight: 650; font-size: var(--tb-fs-sm); background: transparent; cursor: pointer; text-align: left; }
  .needscard { border-color: var(--tb-decide); border-width: 1px 1px 1px 5px; padding: var(--tb-sp-4); display: grid; gap: var(--tb-sp-3); background: color-mix(in srgb, var(--tb-decide-soft) 55%, var(--tb-surface)); }
  .needscard.clear { border-color: var(--tb-ok-bar); background: color-mix(in srgb, var(--tb-ok-soft) 55%, var(--tb-surface)); }
  .needscard header { display: flex; align-items: center; gap: var(--tb-sp-2); } .needscard h2 { font-size: var(--tb-fs-lg); }
  .needscard .cnt { background: var(--tb-decide); color: var(--tb-surface); min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: var(--tb-fs-sm); }
  .need { display: grid; grid-template-columns: 24px 1fr; gap: var(--tb-sp-2); } .need + .need { border-top: 1px solid var(--tb-line); padding-top: var(--tb-sp-3); }
  .nno { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--tb-decide); color: var(--tb-decide); font-weight: 800; font-size: var(--tb-fs-xs); display: inline-flex; align-items: center; justify-content: center; margin-top: 2px; }
  .ntext { margin-bottom: 6px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6; overflow: hidden; } .ntext.full { -webkit-line-clamp: unset; display: block; }
  .nact { display: flex; flex-wrap: wrap; gap: var(--tb-sp-2); } .nmore { background: transparent; border-color: transparent; color: var(--tb-accent); text-decoration: underline; text-underline-offset: 3px; padding: 0 var(--tb-sp-2); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--tb-sp-2); }
  .stat { display: grid; align-content: start; gap: 6px; min-height: 76px; padding: var(--tb-sp-3); border-radius: var(--tb-r-md); border: 1px solid var(--tb-line); background: var(--tb-surface); text-decoration: none; color: var(--tb-text); }
  .stat b { font-size: var(--tb-fs-2xl); line-height: 1; font-variant-numeric: tabular-nums; } .stat span { font-size: var(--tb-fs-sm); color: var(--tb-muted); font-weight: 600; }
  .stat.blocked.hot { background: var(--tb-blocked-soft); border-color: var(--tb-blocked); } .stat.blocked.hot b, .stat.blocked.hot span { color: var(--tb-blocked); }
  .stat.decide.hot { background: var(--tb-decide-soft); border-color: var(--tb-decide); } .stat.decide.hot b, .stat.decide.hot span { color: var(--tb-decide); }
  .overall { grid-column: 1 / -1; display: grid; gap: 6px; } .overall .row { display: flex; justify-content: space-between; font-size: var(--tb-fs-meta); color: var(--tb-muted); } .overall .row b { color: var(--tb-text); }
  .lead { display: grid; gap: var(--tb-sp-4); } .side { display: contents; }
  .toolbar { display: grid; gap: var(--tb-sp-2); } .tcount { font-size: var(--tb-fs-meta); color: var(--tb-muted); }

  .declist { padding: var(--tb-sp-2) 20px; } .declist > h2, .listcard > h2 { padding: var(--tb-sp-3) 0 var(--tb-sp-1); }
  .drow { border-top: 1px solid var(--tb-line); } .drow:first-child { border-top: 0; }
  summary { list-style: none; cursor: pointer; } summary::-webkit-details-marker { display: none; }
  .drow summary, .drow .dsum { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: var(--tb-sp-2); min-height: 56px; padding: var(--tb-sp-2) 0; }
  .drow .dsum { grid-template-columns: auto 1fr auto; }
  .dq { font-weight: 600; min-width: 0; } .dq small { display: block; font-weight: 400; color: var(--tb-muted); font-size: var(--tb-fs-meta); margin-top: 2px; }
  .did { font-family: var(--tb-mono); font-weight: 700; font-size: var(--tb-fs-sm); color: var(--tb-muted); min-width: 28px; }
  .dbody { display: grid; gap: var(--tb-sp-2); padding: 0 0 var(--tb-sp-4) 36px; } .dbody p { max-width: 70ch; }
  details[open] > summary .chv svg, .smain[aria-expanded="true"] .chv svg { transform: rotate(180deg); }
  .emptycard { padding: var(--tb-sp-4); color: var(--tb-muted); display: grid; gap: var(--tb-sp-2); }
  .emptycard b { color: var(--tb-text); font-size: var(--tb-fs-lg); }

  .mission { padding: 0; overflow: clip; }
  .mission > summary { display: grid; grid-template-columns: auto 1fr auto auto; grid-template-areas: "id name pill chv" "prog prog prog prog"; align-items: center; gap: 2px var(--tb-sp-2); padding: var(--tb-sp-3) var(--tb-sp-4); min-height: 64px; }
  .mid { grid-area: id; font-family: var(--tb-mono); font-weight: 800; color: var(--tb-muted); } .mname { grid-area: name; font-size: var(--tb-fs-lg); font-weight: 700; line-height: 1.25; min-width: 0; }
  .mission > summary .pill { grid-area: pill; } .mission > summary .chv { grid-area: chv; } .mprog { grid-area: prog; display: flex; align-items: center; gap: var(--tb-sp-3); } .mprog .bartrack { flex: 1; max-width: 360px; }
  .goal { padding: 0 var(--tb-sp-4) var(--tb-sp-3); color: var(--tb-muted); max-width: 80ch; }
  .slices { border-top: 1px solid var(--tb-line); }
  .srow { --tb-prw: 92px; border-bottom: 1px solid var(--tb-line); } .srow:last-child { border-bottom: 0; }

// Long-press on a touch screen starts a note without turning Annotate on.
let suppress = null, lp = null;
page.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" || e.target.closest("input, textarea, a, .tblwrap")) return;
  const el = annotatable(e.target); if (!el) return;
  const x = e.clientX, y = e.clientY; clearTimeout(lp);
  lp = setTimeout(() => {
    lp = null; suppress = el; if (navigator.vibrate) navigator.vibrate(12); annotate(el);
    document.addEventListener("pointerup", () => setTimeout(() => { suppress = null; }, 400), { once: true });
  }, 520);
  const cancel = ev => { if (ev && ev.type === "pointermove" && Math.hypot(ev.clientX - x, ev.clientY - y) < 10) return; clearTimeout(lp); lp = null; page.removeEventListener("pointermove", cancel); page.removeEventListener("pointerup", cancel); page.removeEventListener("pointercancel", cancel); };
  page.addEventListener("pointermove", cancel); page.addEventListener("pointerup", cancel, { once: true }); page.addEventListener("pointercancel", cancel, { once: true });
});
page.addEventListener("contextmenu", e => { if (e.pointerType !== "mouse" && (lp || suppress) && annotatable(e.target)) e.preventDefault(); });
// Select text with Annotate on to quote it.
function quoteSel() {
  if (!document.body.classList.contains("annotating")) return;
  const sel = getSelection(), text = String(sel || "").trim(); if (!text || !sel.anchorNode) return;
  const node = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement, el = annotatable(node);
  if (el && !el.closest(".sheet")) { annotate(el, text.slice(0, 500)); sel.removeAllRanges(); }
}
document.addEventListener("mouseup", () => setTimeout(quoteSel, 0));
let selT; document.addEventListener("selectionchange", () => { if (!matchMedia("(pointer: coarse)").matches) return; clearTimeout(selT); selT = setTimeout(quoteSel, 700); });

annotBtn.addEventListener("click", () => openSheet(!sheet.classList.contains("on")));
$("#sheetclose").addEventListener("click", () => openSheet(false)); scrim.addEventListener("click", () => openSheet(false));
$$("#seg button").forEach(x => x.addEventListener("click", () => { const on = x.dataset.v === "on"; setAnno(on); if (on && MODAL()) openSheet(false); }));
$("#annodone").addEventListener("click", () => { setAnno(false); }); $("#annonotes").addEventListener("click", () => openSheet(true));
$("#notelist").addEventListener("click", e => { const r = e.target.closest(".rm"); if (r) { notes.splice(+r.dataset.i, 1); saveNotes(); } });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (composer.classList.contains("on")) { closeComposer(); return; }
  if ($("#dgfull").open) return;
  if (sheet.classList.contains("on")) openSheet(false); else if (document.body.classList.contains("annotating")) setAnno(false);
});
// Keep Tab inside a modal sheet or note box.
const trapTab = box => e => {
  if (e.key !== "Tab" || !MODAL()) return;
  const f = $$("button:not([disabled]), textarea, [tabindex='0']", box).filter(x => !x.closest("[hidden]")); if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && (document.activeElement === first || document.activeElement === box)) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
};
sheet.addEventListener("keydown", trapTab(sheet)); composer.addEventListener("keydown", trapTab(composer));
$("#send").addEventListener("click", async () => {
  const send = $("#send"); send.disabled = true; setStatus("Sending…");
  try {
    const r = await fetch("feedback", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ notes: notes.map(({ id, kind, anchor, quote, text }) => ({ id, kind, anchor, quote, text })) }) });
    const body = await r.text();
    if (r.status !== 202) { setStatus(`Not sent (${r.status}): ${body}. Your notes are kept; try again.`, "err"); send.disabled = false; return; }
    pending = JSON.parse(body).id; notes = []; saveNotes(); $("#reply").hidden = true; setStatus("Queued for the human seat…", "ok");
  } catch (err) { setStatus(`Not sent: ${err.message}. Your notes are kept; try again.`, "err"); send.disabled = false; }
});
const stateText = { queued: "Queued for the human seat…", delivered: "Delivered to the human seat…", working: "The seat is working on it…", done: "Done. Reply below.", aborted: "The run was stopped." };
if ("EventSource" in window && location.protocol.startsWith("http")) {
  const es = new EventSource("events");
  addEventListener("pagehide", () => es.close());
  es.addEventListener("hello", e => { online = true; authed = !!JSON.parse(e.data).auth; setStatus(authed ? "Connected. Notes are sent to the human seat." : "Read-only: open the login link from the human seat (board.cjs login) to send feedback.", authed ? "ok" : ""); paintNotes(); });
  es.addEventListener("status", e => { const d = JSON.parse(e.data); if (!pending || d.id === pending) setStatus(stateText[d.state] || d.state, "ok"); });
  es.addEventListener("reply", e => { const d = JSON.parse(e.data); if (pending && d.id !== pending) return; const r = $("#reply"); r.hidden = false; r.textContent = d.reply || "(no reply text)"; pending = null; openSheet(true); });
  es.addEventListener("reload", () => {
    ss.set(`${store}:y`, String(scrollY)); ss.set(`${store}:reply`, $("#reply").hidden ? "" : $("#reply").textContent);
    ss.set(`${store}:open`, sheet.classList.contains("on") ? "1" : ""); ss.set(`${store}:focus`, composer.classList.contains("on") ? "1" : ""); persistDraft(); location.reload();
  });
  es.onerror = () => { if (!online) setStatus("Feedback server offline: notes stay in this browser.", "err"); };
} else setStatus("Feedback needs the board server: notes stay in this browser.");

// ---- Diagram full size ----
const dlg = $("#dgfull");
page.addEventListener("click", e => {
  const z = e.target.closest("[data-zoom]"); if (!z) return;
  const src = document.getElementById(z.dataset.zoom); if (!src) return;
  const svg = (matchMedia("(max-width: 699px)").matches && $(".dg-tall svg", src)) || $(".dg-wide svg", src); if (!svg) return;
  $("#dgfull-t").textContent = z.dataset.title; $("#dgfull-body").innerHTML = svg.outerHTML; $("#dgfull-body").classList.remove("actual"); $("#dgfull-zoom").setAttribute("aria-pressed", "false");
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
});
$("#dgfull-zoom").addEventListener("click", e => { const on = $("#dgfull-body").classList.toggle("actual"); e.currentTarget.setAttribute("aria-pressed", String(on)); });
$("#dgfull-x").addEventListener("click", () => dlg.close ? dlg.close() : dlg.removeAttribute("open"));
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

// ---- Print: everything open and light ----
let themeBefore = null;
addEventListener("beforeprint", () => { themeBefore = root.getAttribute("data-theme"); root.setAttribute("data-theme", "light"); $$("details").forEach(d => { d.dataset.was = d.open ? "1" : ""; d.open = true; }); $$("ul.limited").forEach(u => { u.dataset.was = u.classList.contains("all") ? "1" : ""; u.classList.add("all"); }); });
addEventListener("afterprint", () => { if (themeBefore) root.setAttribute("data-theme", themeBefore); else root.removeAttribute("data-theme"); $$("details").forEach(d => { d.open = d.dataset.was === "1"; }); $$("ul.limited").forEach(u => u.classList.toggle("all", u.dataset.was === "1")); });

// ---- Start ----
document.title = `${b.title || "Tracking board"} · Tracking board`;
$("#bartitle").textContent = b.title || "Tracking board";
apply(); paintNotes();
const y = ss.get(`${store}:y`); if (y) { ss.del(`${store}:y`); setTimeout(() => scrollTo({ top: +y, behavior: "instant" }), 200); }
const keptReply = ss.get(`${store}:reply`); if (keptReply) { ss.del(`${store}:reply`); $("#reply").hidden = false; $("#reply").textContent = keptReply; }
if (ss.get(`${store}:open`)) { ss.del(`${store}:open`); openSheet(true); }
let savedDraft = null; try { savedDraft = JSON.parse(ls.get(`${store}:draft`) || "null"); } catch { savedDraft = null; }
if (savedDraft && savedDraft.akey) { const refocus = ss.get(`${store}:focus`) === "1"; ss.del(`${store}:focus`); openComposer(savedDraft, refocus); }
if (query.get("annotate")) setAnno(true);
if (panelMode() && notes.length && !sheet.classList.contains("on")) openSheet(true, true);
if (location.hash) setTimeout(() => openHash(true), 0);
})();
</script>
</body>
</html>
