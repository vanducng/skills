<!doctype html>
<html><head><meta charset="utf-8"><title>Delivery charts</title></head>
<body>
<h1>Delivery charts</h1>
<p>Remaining work against the ideal line.</p>
<figure class="chart">
  <img src="charts/burndown.png" alt="Sprint burndown" width="1200" height="600">
  <figcaption>Burndown, sprint 42</figcaption>
</figure>
<p>Points finished per sprint.</p>
<div class="chart">
<svg id="velocity" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Velocity by sprint">
  <title>Velocity by sprint</title>
  <rect x="80" y="200" width="120" height="400" fill="#4c9aff"/>
  <rect x="260" y="150" width="120" height="450" fill="#4c9aff"/>
  <text x="80" y="640" font-size="14">S40</text>
  <text x="260" y="640" font-size="14">S41</text>
</svg>
</div>
</body></html>
