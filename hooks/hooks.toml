# vd-cli agent hooks manifest (Claude Code + Codex).
# `vd install hooks` copies these files into ~/.claude/hooks and registers plain
# events in ~/.claude/settings.json. codex.*-prefixed events also install to
# ~/.codex/hooks and register in ~/.codex/hooks.json (codex.notify wires the
# `notify` program in ~/.codex/config.toml). lib entries are copied only.
# All hooks are stdlib Python (no pip deps); runtime "uv" is available for
# future hooks that need third-party packages.

[[hook]]
file = "session-init.py"
runtime = "python3"
event = "SessionStart"
matcher = "startup|resume|clear|compact"

[[hook]]
file = "subagent-init.py"
runtime = "python3"
event = "SubagentStart"
matcher = "*"

[[hook]]
file = "team-context-inject.py"
runtime = "python3"
event = "SubagentStart"
matcher = "*"

[[hook]]
file = "dev-rules-reminder.py"
runtime = "python3"
event = "UserPromptSubmit"

[[hook]]
file = "dev-rules-reminder.py"
runtime = "python3"
event = "codex.UserPromptSubmit"

[[hook]]
file = "scout-block.py"
runtime = "python3"
event = "PreToolUse"
matcher = "Bash|Glob|Grep|Read|Edit|Write"

[[hook]]
file = "statusline.py"
runtime = "python3"
event = "statusLine"

# Copied but not registered (invoked by the team runtime, not a CC event).
[[hook]]
file = "task-completed-handler.py"
lib = true

[[hook]]
file = "teammate-idle-handler.py"
lib = true

[[hook]]
file = "lib/vd_config.py"
lib = true

[[hook]]
file = "lib/vd_paths.py"
lib = true

[[hook]]
file = "lib/vd_state.py"
lib = true

# Telegram notifier (Python) — pings on turn-complete and approval.
[[hook]]
file = "agent-notify.py"
runtime = "python3"
event = "Stop"
args = ["claude", "stop"]

[[hook]]
file = "agent-notify.py"
runtime = "python3"
event = "Notification"
args = ["claude", "notification"]

# Pre-merge guard — blocks `gh pr merge` while the PR has unresolved review threads.
[[hook]]
file = "pr-merge-guard.py"
runtime = "python3"
event = "PreToolUse"
matcher = "Bash"

# Also fire the notifier on Codex turns (wires ~/.codex/config.toml notify).
[[hook]]
file = "agent-notify.py"
runtime = "python3"
event = "codex.notify"
args = ["codex"]
